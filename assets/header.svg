<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Hi, I'm Jason. Aspiring backend engineer, gopher at heart.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#00add8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00add8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="240" rx="18"/></clipPath>
    <clipPath id="type"><rect class="typer" x="60" y="140" width="568" height="34"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .rise { opacity: 0; animation: rise .8s ease-out forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .4s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .typer { transform-box: fill-box; transform-origin: left; transform: scaleX(0);
               animation: type 2.7s steps(43) 1.1s forwards; }
      @keyframes type { to { transform: scaleX(1); } }
      .cursor { animation: move 2.7s steps(43) 1.1s forwards, blink 1s step-end infinite; }
      @keyframes move { to { transform: translateX(574px); } }
      @keyframes blink { 50% { opacity: 0; } }

      .led { animation: led 2s ease-in-out infinite; }
      .l2 { animation-duration: 1.3s; animation-delay: .3s; }
      .l3 { animation-duration: 2.7s; animation-delay: .8s; }
      .l4 { animation-duration: .9s; }
      .l5 { animation-duration: 1.7s; animation-delay: .5s; }
      .l6 { animation-duration: 3.1s; animation-delay: 1.2s; }
      @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#dots)"/>
    <rect width="900" height="240" fill="url(#glow)"/>
  </g>

  <!-- left: intro -->
  <text class="mono rise d1" x="60" y="70" font-size="16" fill="#7ee787">$ whoami</text>
  <text class="sans rise d2" x="58" y="122" font-size="46" font-weight="700" fill="#e6edf3">Hi, I'm Jason<tspan fill="#00add8">.</tspan></text>

  <g clip-path="url(#type)">
    <text class="mono" x="60" y="164" font-size="22" fill="#9fb3c8" textLength="568" lengthAdjust="spacingAndGlyphs">aspiring backend engineer · gopher at heart</text>
  </g>
  <rect class="cursor" x="62" y="146" width="11" height="24" fill="#00add8"/>

  <!-- right: tiny homelab rack -->
  <g class="float">
    <rect x="710" y="52" width="140" height="138" rx="10" fill="#0a0f1a" stroke="#22324a" stroke-width="2"/>
    <g>
      <rect x="722" y="64" width="116" height="34" rx="5" fill="#141e30"/>
      <circle class="led" cx="736" cy="81" r="4" fill="#3fb950"/>
      <circle class="led l2" cx="750" cy="81" r="4" fill="#00add8"/>
      <g stroke="#2c3e57" stroke-width="2"><line x1="770" y1="74" x2="826" y2="74"/><line x1="770" y1="81" x2="826" y2="81"/><line x1="770" y1="88" x2="826" y2="88"/></g>
    </g>
    <g>
      <rect x="722" y="104" width="116" height="34" rx="5" fill="#141e30"/>
      <circle class="led l3" cx="736" cy="121" r="4" fill="#3fb950"/>
      <circle class="led l4" cx="750" cy="121" r="4" fill="#d29922"/>
      <g stroke="#2c3e57" stroke-width="2"><line x1="770" y1="114" x2="826" y2="114"/><line x1="770" y1="121" x2="826" y2="121"/><line x1="770" y1="128" x2="826" y2="128"/></g>
    </g>
    <g>
      <rect x="722" y="144" width="116" height="34" rx="5" fill="#141e30"/>
      <circle class="led l5" cx="736" cy="161" r="4" fill="#3fb950"/>
      <circle class="led l6" cx="750" cy="161" r="4" fill="#00add8"/>
      <g stroke="#2c3e57" stroke-width="2"><line x1="770" y1="154" x2="826" y2="154"/><line x1="770" y1="161" x2="826" y2="161"/><line x1="770" y1="168" x2="826" y2="168"/></g>
    </g>
  </g>
</svg>
